@let film = filmComputed();
@if (film) {
  <div class="detail-card">
    <div class="detail-card__left-block">
      <img class="film-poster" src="{{ film.poster ?? '' }}" alt="film-poster" />
    </div>
    <div class="detail-card__right-block">
      <h2 class="title">{{ film.title }}</h2>
      <div class="info">
        <span class="year"
          ><img src="icons/calendar.svg" alt="calendar-icon" width="20" height="20" />{{
            film.year
          }}</span
        >
        <span class="genre"
          ><img src="icons/tape.svg" alt="calendar-icon" width="20" height="20" />{{
            film.genre
          }}</span
        >
        <span class="rating"
          ><img src="icons/star.svg" alt="calendar-icon" width="20" height="20" />{{
            film.rating
          }}/10</span
        >
      </div>
      <div class="overview">
        <h3 class="subtitle">Overview</h3>
        <p class="description">{{ film.description }}</p>
      </div>
    </div>
  </div>
} @else {
  <h3>Not found film</h3>
}
